include:
  - project: devops/cicd/templates
    ref: ${CICD_TEMPLATES_2_VERSION}
    file:
      - docker.gitlab-ci.yml
      - sonarqube.gitlab-ci.yml

variables:
  PROJECT: payment-api
  CHART_DIR: charts/payment-api

stages:
  - build_and_test
  - publish
  - deploy

app:sonarqube:
  stage: build_and_test
  extends:
    - .sonarqube_dotnet
  needs: []

helm:lint:
  stage: build_and_test
  needs: []
  trigger:
    include:
      - local: /.gitlab-ci/helm-lint.gitlab-ci.yml
    strategy: depend
  rules:
    - when: always

.build:
  stage: build_and_test
  extends:
    - .docker_build
  needs: []
  variables:
    DOCKERFILE: Dockerfile
    BUILD_ARGS: "PROJECT_DIR PROJECT_NAME"

.publish:
  stage: publish
  extends:
    - .docker_publish

.api:
  variables:
    IMAGE_NAME: payment-web-api

build:api:
  extends:
    - .build
    - .api
  variables:
    PROJECT_DIR: VPay.Payment.Api
    PROJECT_NAME: VPay.Payment.Api

publish:api:
  extends:
    - .publish
    - .api
  needs:
    - build:api

deploy:
  stage: deploy
  trigger:
    include:
      - local: /.gitlab-ci/deploy.gitlab-ci.yml
  rules:
    - if: $CHART_DIR && $CI_COMMIT_TAG
      when: on_success
