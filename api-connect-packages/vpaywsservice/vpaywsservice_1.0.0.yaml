                    source: "var body = apim.getvariable('message.body');\r\nvar op = apim.getvariable('api.operation.id');\r\nvar saved = {\r\n    id: '',\r\n    passphrase: '',\r\n    userName: '',\r\n    password: ''\r\n};\r\n\r\nfunction flatten(data) {\r\n    function isEmpty(obj) {\r\n        for(var key in obj) {\r\n            if(obj.hasOwnProperty(key))\r\n                return false;\r\n        }\r\n        return true;\r\n    }\r\n\r\n    function recurse (cur, prop, last) {\r\n        if (Object(cur) === cur) {\r\n        \tif (!!cur[\"@xmlns\"]) {\r\n        \t\tdelete cur[\"@xmlns\"];\r\n          }\r\n          var split = prop.split(':');\r\n          if (split.length == 2) {\r\n          \tlast[split[1]] = last[prop];\r\n            delete last[prop];\r\n            prop = split[1];\r\n          }\r\n          if (!!cur['$']) {\r\n            last[prop] = cur['$'];\r\n          } else if (isEmpty(cur)){\r\n              last[prop] = '';\r\n          } else {\r\n            for (var p in cur) {\r\n              recurse(cur[p], p, cur);\r\n            }\r\n          }\r\n       }\r\n    }\r\n    recurse(data, \"\");\r\n    return data;\r\n}\r\nbody = flatten(body);\r\nsaved = {\r\n    id: body.Envelope.Body[op].av.id,\r\n    passphrase: body.Envelope.Body[op].av.passPhrase,\r\n    userName: '',\r\n    password: ''\r\n};\r\n\r\nif (body.Envelope.Body[op].hasOwnProperty('sr')){\r\n    saved.userName = body.Envelope.Body[op].sr.commonData.user;\r\n    saved.password = body.Envelope.Body[op].sr.commonData.passWord;\r\n} else if (body.Envelope.Body[op].hasOwnProperty('transactionDetailRequest')){\r\n    saved.userName = body.Envelope.Body[op].transactionDetailRequest.user;\r\n    saved.password = body.Envelope.Body[op].transactionDetailRequest.passWord;\r\n} else if (body.Envelope.Body[op].hasOwnProperty('reasonCodeRequest')){\r\n    saved.userName = body.Envelope.Body[op].reasonCodeRequest.user;\r\n    saved.password = body.Envelope.Body[op].reasonCodeRequest.passWord;\r\n}\r\n\r\napim.setvariable('saved', saved);\r\napim.setvariable('message.body', body);\r\napim.setvariable('message.headers.accept', 'application/json');\r\napim.setvariable('message.headers.content-type', 'application/json');\r\n"
                - invoke:
