                    version: 1.0.0
          otherwise: []
          version: 1.0.0
      - xslt:
          title: xslt
          input: true
          version: 1.0.0
          source: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\r\n<xsl:stylesheet \r\n    xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\r\n    version=\"1.0\">\r\n    <xsl:output method=\"xml\" indent=\"yes\"/>\r\n\r\n    <xsl:template match=\"/*[local-name()='Envelope']\">\r\n        <soap:Envelope xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\">\r\n            <xsl:copy-of select=\"node()|@*\"/>\r\n        </soap:Envelope>\r\n     </xsl:template>\r\n</xsl:stylesheet>\r\n"
      - if:
          title: if
          condition: >-
            apim.getvariable('saved.soapNamespace') ===
            "http://www.w3.org/2003/05/soap-envelope"
          execute:
            - xslt:
                title: xslt
                input: true
                version: 1.0.0
                source: "<xsl:stylesheet version=\"1.0\" \r\nxmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\">\r\n<xsl:output method=\"xml\" version=\"1.0\" encoding=\"UTF-8\" indent=\"yes\"/>\r\n<xsl:strip-space elements=\"*\"/>\r\n\r\n<xsl:param name=\"no-namespace\" select=\"true()\"/>\r\n\r\n<xsl:template match=\"*\">\r\n    <xsl:choose>\r\n        <xsl:when test=\"$no-namespace\">\r\n            <xsl:element name=\"{local-name()}\">\r\n                <xsl:copy-of select=\"namespace::*[.!='http://schemas.xmlsoap.org/soap/envelope/']\"/>\r\n                <xsl:copy-of select=\"@*\"/>\r\n                <xsl:apply-templates/>\r\n            </xsl:element>\r\n        </xsl:when>\r\n        <xsl:otherwise>\r\n            <xsl:copy>\r\n                <xsl:copy-of select=\"namespace::*[.!='http://schemas.xmlsoap.org/soap/envelope/']\"/>\r\n                <xsl:copy-of select=\"@*\"/>\r\n                <xsl:apply-templates/>\r\n            </xsl:copy>\r\n        </xsl:otherwise>\r\n    </xsl:choose>\r\n</xsl:template>\r\n\r\n</xsl:stylesheet>"
            - xslt:
                title: xslt
                input: true
                version: 1.0.0
                source: "<xsl:stylesheet version=\"1.0\"\r\n xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\r\n xmlns:soap=\"http://www.w3.org/2003/05/soap-envelope\">\r\n <xsl:output omit-xml-declaration=\"yes\" indent=\"yes\"/>\r\n\r\n <xsl:template match=\"node()|@*\">\r\n  <xsl:copy>\r\n   <xsl:apply-templates select=\"node()|@*\"/>\r\n  </xsl:copy>\r\n </xsl:template>\r\n\r\n <xsl:template match=\"*[local-name()='Body']\">\r\n  <xsl:element name=\"soap:{name()}\" namespace=\"http://www.w3.org/2003/05/soap-envelope\">\r\n    <xsl:copy-of select=\"namespace::*\"/>\r\n    <xsl:apply-templates select=\"node()|@*\"/>\r\n  </xsl:element>\r\n </xsl:template>\r\n \r\n <xsl:template match=\"/*[local-name()='Envelope']\">\r\n  <xsl:element name=\"soap:{name()}\" namespace=\"http://www.w3.org/2003/05/soap-envelope\">\r\n    <xsl:copy-of select=\"namespace::*\"/>\r\n    <xsl:apply-templates select=\"node()|@*\"/>\r\n  </xsl:element>\r\n </xsl:template>\r\n</xsl:stylesheet>"
          version: 1.0.0
      - xslt:
          title: xslt
          input: true
          version: 1.0.0
          source: "<xsl:stylesheet version=\"1.0\"\r\n xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\">\r\n <xsl:output omit-xml-declaration=\"yes\" indent=\"yes\"/>\r\n <xsl:strip-space elements=\"*\"/>\r\n\r\n<xsl:template match=\"@*|node()\">\r\n  <xsl:if  test=\". != '' or ./@* != ''\">\r\n    <xsl:copy>\r\n       <xsl:copy-of select = \"@*\"/>\r\n       <xsl:apply-templates/>\r\n    </xsl:copy>\r\n  </xsl:if>\r\n</xsl:template>\r\n\r\n</xsl:stylesheet>"
      - gatewayscript:
          title: gatewayscript
          version: 1.0.0
          source: "if (apim.getvariable('saved.soapNamespace') === \"http://www.w3.org/2003/05/soap-envelope\") {\napim.setvariable('message.headers.Content-Type', 'application/soap+xml; charset=utf-8');\n} else {\napim.setvariable('message.headers.Content-Type', 'text/xml; charset=utf-8');\n}\t"
