  assembly:
    execute:
      - xml-to-json:
          title: xml-to-json
          version: 1.0.0
      - gatewayscript:
          title: gatewayscript
          version: 1.0.0
          source: "var body = apim.getvariable('message.body');\r\nvar op = apim.getvariable('api.operation.id');\r\n\r\nfunction flatten(data) {\r\n    var soapNamespace = \"\";\r\n    function isEmpty(obj) {\r\n        for(var key in obj) {\r\n            if(obj.hasOwnProperty(key))\r\n                return false;\r\n        }\r\n        return true;\r\n    }\r\n\r\n    function recurse (cur, prop, last) {\r\n        if (Object(cur) === cur) {\r\n          var xmlns = cur[\"@xmlns\"];\r\n          if (!!cur[\"@xmlns\"]) {\r\n        \tdelete cur[\"@xmlns\"];\r\n          }\r\n          var split = prop.split(':');\r\n          if (split.length == 2) {\r\n            if (split[1] === \"Envelope\") {\r\n                soapNamespace = xmlns[split[0]];\r\n            }\r\n          \tlast[split[1]] = last[prop];\r\n            delete last[prop];\r\n            prop = split[1];\r\n          }\r\n          if (!!cur['$']) {\r\n            last[prop] = cur['$'];\r\n          } else if (isEmpty(cur)){\r\n              last[prop] = '';\r\n          } else {\r\n            for (var p in cur) {\r\n              recurse(cur[p], p, cur);\r\n            }\r\n          }\r\n       }\r\n    }\r\n    recurse(data, \"\");\r\n    return { \"data\": data, \"soapNamespace\": soapNamespace };\r\n}\r\n\r\nvar soapInfo = flatten(body);\r\n\r\nbody = soapInfo.data;\r\n\r\napim.setvariable('saved.soapNamespace', soapInfo.soapNamespace);\r\napim.setvariable('message.body', body);\r\napim.setvariable('message.headers.accept', 'application/json');\r\napim.setvariable('message.headers.content-type', 'application/json');"
      - proxy:
          title: proxy
          target-url: $(api.properties.api-endpoint)/$(api.operation.id)
          output: echo_invoke
      - operation-switch:
          title: operation-switch
          case:
            - operations:
                - LoadCard
              execute:
                - map:
                    title: map
                    inputs:
