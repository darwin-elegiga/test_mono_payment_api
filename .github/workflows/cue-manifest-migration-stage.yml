name: cue-manifest-migration-stage

permissions:
  contents: write
  actions: read
  id-token: write
  pull-requests: read
  packages: read
  security-events: write

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or SHA to publish from.
        required: false
        type: string
        default: ''
      repo_name:
        description: Optional repo-name override for the manifest folder.
        required: false
        type: string
        default: ''

jobs:
  cue-manifest-migration-stage:
    runs-on:
      group: vpay-runner-group
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref_name }}

      - name: Resolve repository name
        shell: bash
        run: |
          set -euo pipefail

          repo_name_input='${{ inputs.repo_name }}'
          if [[ -n "$repo_name_input" ]]; then
            repo_name="$repo_name_input"
          else
            repo_name='${{ github.event.repository.name }}'
          fi

          safe_repo_name="$(printf '%s' "$repo_name" | tr -cd 'A-Za-z0-9._-')"
          if [[ -z "$safe_repo_name" ]]; then
            echo "Repository name is empty after sanitization" >&2
            exit 1
          fi

          source_ref_input='${{ inputs.source_ref }}'
          if [[ -n "$source_ref_input" ]]; then
            source_ref="$source_ref_input"
          else
            source_ref="$GITHUB_REF_NAME"
          fi

          echo "REPO_NAME=$safe_repo_name" >> "$GITHUB_ENV"
          echo "SOURCE_REF_NAME=$source_ref" >> "$GITHUB_ENV"

      - name: Install CUE
        shell: bash
        run: |
          set -euo pipefail
          curl -sSLo cue.tar.gz https://github.com/cue-lang/cue/releases/download/v0.9.2/cue_v0.9.2_linux_amd64.tar.gz
          tar -xzf cue.tar.gz
          mkdir -p "$HOME/bin"
          mv cue "$HOME/bin/"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/cue" version

      - name: Checkout manifests repository
        uses: actions/checkout@v4
        with:
          repository: optum-financial/vpay-actions-common-workflow
          ref: k8s-cue-manifests
          token: ${{ secrets.AVPAY_DEVOPS }}
          path: manifests
          fetch-depth: 0

      - name: Generate CUE manifests
        shell: bash
        run: |
          set -euo pipefail
          bash ./cac/scripts/generate-stage.sh "$SOURCE_REF_NAME"

      - name: Render Helm manifests
        shell: bash
        run: |
          set -euo pipefail

          env_name='stage'
          cat <<EOF > default-env-dc-values.yaml
          global:
            environment:
              name: Staging
              ingress:
                subdomain: stage.pks.vpayusa.net
          EOF

          helm dependency build charts/payment-api
          helm template payment-api charts/payment-api \
            -f default-env-dc-values.yaml \
            -f charts/payment-api/values-${env_name}.yaml \
            -f charts/payment-api/secret-values.yaml \
            --namespace "client-payments-${env_name}" \
            > "/tmp/payment-api-helm-${env_name}.yaml"

      - name: Compare CUE and Helm manifests
        shell: bash
        env:
          ENV_NAME: stage
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import os

          import yaml

          env_name = os.environ["ENV_NAME"]
          cue_dir = Path(f"cac/generated/{env_name}")
          helm_file = Path(f"/tmp/payment-api-helm-{env_name}.yaml")

          def load_documents(directory_or_file):
            documents = []
            paths = sorted(directory_or_file.glob("*.yaml")) if directory_or_file.is_dir() else [directory_or_file]
            for path in paths:
              for document in yaml.safe_load_all(path.read_text()):
                if document is not None:
                  documents.append(document)
            return documents

          def metadata(document):
            return document.get("metadata") or {}

          def spec(document):
            return document.get("spec") or {}

          def template_spec(document):
            return (((spec(document).get("template") or {}).get("spec")) or {})

          def normalize_image(image):
            if not image:
              return image
            parts = image.split("/")
            if len(parts) < 3:
              return image
            return "/".join(parts[-2:])

          def deployment_images(document):
            if document.get("kind") != "Deployment":
              return []
            containers = template_spec(document).get("containers") or []
            normalized_images = []
            for container in containers:
              normalized_images.append(normalize_image(container.get("image")))
            return sorted(image for image in normalized_images if image is not None)

          def compare_kind(document):
            kind = document.get("kind")
            if kind == "ExternalSecret":
              return "Secret"
            if kind == "HTTPRoute":
              return "Ingress"
            if kind == "ConfigMap":
              return None
            return kind

          def compare_key(document):
            kind = compare_kind(document)
            if kind is None:
              return None
            return (kind, metadata(document).get("name") or "")

          cue_docs = load_documents(cue_dir)
          helm_docs = load_documents(helm_file)

          cue_keys = sorted(key for doc in cue_docs if (key := compare_key(doc)) is not None)
          helm_keys = sorted(key for doc in helm_docs if (key := compare_key(doc)) is not None)

          if cue_keys != helm_keys:
            raise SystemExit(f"CUE and Helm manifest keys differ for {env_name}: {cue_keys} != {helm_keys}")

          cue_images = sorted(
            (compare_key(doc), deployment_images(doc))
            for doc in cue_docs
            if compare_key(doc) is not None and deployment_images(doc)
          )
          helm_images = sorted(
            (compare_key(doc), deployment_images(doc))
            for doc in helm_docs
            if compare_key(doc) is not None and deployment_images(doc)
          )

          if cue_images != helm_images:
            raise SystemExit(f"CUE and Helm deployment images differ for {env_name}: {cue_images} != {helm_images}")

          print(f"CUE and Helm manifests match for {env_name}")
          PY

      - name: Publish generated manifests
        shell: bash
        run: |
          set -euo pipefail

          env_name='stage'
          source_env_dir="$GITHUB_WORKSPACE/cac/generated/$env_name"
          manifest_repo_dir="$GITHUB_WORKSPACE/manifests"
          target_env_dir="$manifest_repo_dir/k8s-cue-manifests/$REPO_NAME/$env_name"

          rm -rf "$target_env_dir"
          mkdir -p "$target_env_dir"

          shopt -s nullglob
          generated_files=("$source_env_dir"/*.yaml "$source_env_dir"/*.yml)
          if [[ ${#generated_files[@]} -eq 0 ]]; then
            echo "No generated YAML files found in $source_env_dir" >&2
            exit 1
          fi

          cp "${generated_files[@]}" "$target_env_dir/"
          shopt -u nullglob

          git -C "$manifest_repo_dir" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$manifest_repo_dir" config user.name "github-actions[bot]"

          git -C "$manifest_repo_dir" add "k8s-cue-manifests/$REPO_NAME/$env_name"

          if git -C "$manifest_repo_dir" diff --cached --quiet; then
            echo "No manifest changes to publish for $env_name."
            exit 0
          fi

          git -C "$manifest_repo_dir" commit -m "Publish CUE manifests for $REPO_NAME $env_name"
          git -C "$manifest_repo_dir" fetch origin k8s-cue-manifests
          git -C "$manifest_repo_dir" rebase origin/k8s-cue-manifests
          git -C "$manifest_repo_dir" push origin "HEAD:k8s-cue-manifests"
