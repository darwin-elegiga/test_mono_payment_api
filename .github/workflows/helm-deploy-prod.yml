name: helm-deploy-to-prod
on:
  workflow_dispatch:
    inputs:
      CHG_TICKET:
        required: true
        type: string
      WAR_ROOM:
        type: string
        default: 'false'

jobs:
  deployment-prod-dryrun:
    uses: optum-financial/vpay-actions-common-workflow/.github/workflows/helm-deploy-to-prod.yml@main
    with:
      CHARTS_PATH: charts/payment-api
      NAMESPACE: client-payments-prod
      RELEASE_NAME: payment-api
      DRYRUN: true
    secrets: inherit
  deployment-prod:
    uses: optum-financial/vpay-actions-common-workflow/.github/workflows/helm-deploy-to-prod.yml@main
    needs: [deployment-prod-dryrun]
    with:
      CHARTS_PATH: charts/payment-api
      NAMESPACE: client-payments-prod
      RELEASE_NAME: payment-api
      CHG_TICKET: ${{inputs.CHG_TICKET}}
      WAR_ROOM: ${{inputs.WAR_ROOM}}
      DRYRUN: false
    secrets: inherit
