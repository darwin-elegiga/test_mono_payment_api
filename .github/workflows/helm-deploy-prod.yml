name: helm-deploy-to-prod
on: 
   workflow_dispatch:
jobs:
  deployment-plano-prod:
    uses: optum-financial/vpay-actions-common-workflow/.github/workflows/helm-deploy-plano-prod.yml@main
    with: 
      CHARTS_PATH: charts/payment-api
      NAMESPACE: client-payments-prod
      RELEASE_NAME: payment-api
      DRYRUN: false
    secrets: inherit      
  deployment-stl-prod:
    uses: optum-financial/vpay-actions-common-workflow/.github/workflows/helm-deploy-stl-prod.yml@main
    with: 
      CHARTS_PATH: charts/payment-api
      NAMESPACE: client-payments-prod
      RELEASE_NAME: payment-api
      DRYRUN: false
    secrets: inherit      

    
