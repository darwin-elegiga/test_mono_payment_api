name: cue-deploy-to-stage

permissions:
  contents: write
  actions: read
  id-token: write
  pull-requests: read
  packages: read
  security-events: write

on:
  workflow_dispatch:

jobs:
  generate-cue-manifest:
    runs-on:
      group: vpay-runner-group
    outputs:
      deployed_by: ${{ steps.generate_cue.outputs.deployed_by }}
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Resolve repository name
        shell: bash
        run: |
          set -euo pipefail
          repo_name='${{ github.event.repository.name }}'
          safe_repo_name="$(printf '%s' "$repo_name" | tr -cd 'A-Za-z0-9._-')"
          if [[ -z "$safe_repo_name" ]]; then
            echo "Repository name is empty after sanitization" >&2
            exit 1
          fi

          echo "REPO_NAME=$safe_repo_name" >> "$GITHUB_ENV"
          echo "SOURCE_REF_NAME=${{ github.ref_name }}" >> "$GITHUB_ENV"

      - name: Install CUE
        shell: bash
        run: |
          set -euo pipefail
          curl -sSLo cue.tar.gz https://github.com/cue-lang/cue/releases/download/v0.14.2/cue_v0.14.2_linux_amd64.tar.gz
          tar -xzf cue.tar.gz
          mkdir -p "$HOME/bin"
          mv cue "$HOME/bin/"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/cue" version

      - name: Generate CUE manifests
        id: generate_cue
        shell: bash
        env:
          IMAGE_TAG: ${{ github.ref_name }}
          ENV_NAME: stage
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_WORKFLOW_NAME: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd cac
          mkdir -p "generated/$ENV_NAME"
          is_bot_actor() {
            local actor="${1:-}"
            [[ -n "$actor" && ("$actor" == "github-actions" || "$actor" == "github-actions[bot]") ]]
          }

          get_event_field() {
            local jq_expr="$1"
            if command -v jq >/dev/null 2>&1; then
              jq -r "$jq_expr // empty" "$GITHUB_EVENT_PATH" 2>/dev/null || true
            fi
          }

          event_sender="$(get_event_field '.sender.login')"
          event_pr_user="$(get_event_field '.pull_request.user.login')"
          event_release_author="$(get_event_field '.release.author.login')"

          raw_deployed_by="${GITHUB_TRIGGERING_ACTOR:-}"
          if [[ -z "$raw_deployed_by" ]] || is_bot_actor "$raw_deployed_by"; then raw_deployed_by="${GITHUB_ACTOR:-}"; fi
          if [[ -z "$raw_deployed_by" ]] || is_bot_actor "$raw_deployed_by"; then raw_deployed_by="${event_sender:-}"; fi
          if [[ -z "$raw_deployed_by" ]] || is_bot_actor "$raw_deployed_by"; then raw_deployed_by="${event_pr_user:-}"; fi
          if [[ -z "$raw_deployed_by" ]] || is_bot_actor "$raw_deployed_by"; then raw_deployed_by="${event_release_author:-}"; fi
          if [[ -z "$raw_deployed_by" ]] || is_bot_actor "$raw_deployed_by"; then raw_deployed_by="$(git log -1 --pretty=format:%an || true)"; fi
          if [[ -z "$raw_deployed_by" ]] || is_bot_actor "$raw_deployed_by"; then raw_deployed_by="$(git log -1 --pretty=format:%cn || true)"; fi

          safe_deployed_by="$(printf '%s' "$raw_deployed_by" | tr -cd 'A-Za-z0-9._-')"
          if [[ -z "$safe_deployed_by" ]] || is_bot_actor "$safe_deployed_by"; then
            safe_deployed_by="workflow-${GITHUB_WORKFLOW_NAME:-unknown}-${GITHUB_RUN_ID:-0}"
            safe_deployed_by="$(printf '%s' "$safe_deployed_by" | tr -cd 'A-Za-z0-9._-')"
          fi

          echo "deployed_by=$safe_deployed_by" >> "$GITHUB_OUTPUT"

          cue cmd --inject tag="$IMAGE_TAG" --inject deployment="$ENV_NAME" --inject env="$ENV_NAME" --inject deployedBy="$safe_deployed_by" gen .

      - name: Verify generated manifests exist
        shell: bash
        env:
          ENV_NAME: stage
        run: |
          set -euo pipefail
          shopt -s nullglob
          generated_files=("cac/generated/$ENV_NAME"/*.yaml "cac/generated/$ENV_NAME"/*.yml)
          if [[ ${#generated_files[@]} -eq 0 ]]; then
            echo "No generated YAML files found in cac/generated/$ENV_NAME" >&2
            exit 1
          fi
          printf 'Generated files:\n'
          printf ' - %s\n' "${generated_files[@]}"

  publish-cue-manifests:
    uses: optum-financial/vpay-actions-common-workflow/.github/workflows/publish-cue-manifests.yaml@main
    needs: generate-cue-manifest
    with:
      ENV_NAME: stage
      DEPLOYED_BY: ${{ needs.generate-cue-manifest.outputs.deployed_by }}
    secrets: inherit
