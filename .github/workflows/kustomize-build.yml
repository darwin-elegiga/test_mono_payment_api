name: Kustomize Build

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/kustomize-build.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  build:
    name: Validate and Build Kustomize
    runs-on: uhg-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JFrog
        id: jfrog-setup
        uses: uhg-pipelines/epl-jf/saas-setup@v4

      - name: Setup Kustomize
        uses: uhg-pipelines/epl-kustomize/setup@v1
        with:
          kustomize-version: '5.8.1'
          jfrog-password: ${{ steps.jfrog-setup.outputs.access-token }}

      - name: Verify Kustomize
        shell: bash
        run: |
          set -euo pipefail
          kustomize version
          which kustomize

      - name: Discover and build kustomizations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          mapfile -t KUSTOM_FILES < <(find charts -type f \( -name 'kustomization.yaml' -o -name 'kustomization.yml' \) | sort)

          if [ ${#KUSTOM_FILES[@]} -eq 0 ]; then
            echo "No kustomization files found under charts/."
            echo "This run is a validation no-op."
            exit 0
          fi

          for kf in "${KUSTOM_FILES[@]}"; do
            dir="$(dirname "$kf")"
            out_file="$(echo "$dir" | tr '/' '_').yaml"
            echo "Building $dir"
            kustomize build "$dir" > "out/$out_file"
          done

      - name: Upload built manifests
        uses: actions/upload-artifact@v4
        with:
          name: kustomize-manifests
          path: out/*.yaml
          if-no-files-found: warn
          retention-days: 3
