name: deploy-to-stage
permissions:
  contents: read
  pull-requests: read
  packages: read
on: workflow_dispatch

jobs:
  deployment-plano-stage:
    uses: optum-financial/vpay-actions-common-workflow/.github/workflows/helm-deploy-plano-stage.yml@feature-configmap
    with: 
      CHARTS_PATH: charts/payment-api
      NAMESPACE: client-payments-stage
      RELEASE_NAME: payment-api
      DRYRUN: false
      SOURCE_CODE_PATH: ./src
    secrets: inherit      
