name: Publish AppSettings ConfigMap

on:
  push:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to publish
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

permissions:
  contents: read
  actions: read

jobs:
  publish-appsettings-configmap:
    runs-on:
      group: vpay-runner-group
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 0

      - name: Resolve publish context
        shell: bash
        
        run: |
          set -euo pipefail
          repo_name='${{ github.event.repository.name }}'
          safe_repo_name="$(printf '%s' "$repo_name" | tr -cd 'A-Za-z0-9._-')"
          if [[ -z "$safe_repo_name" ]]; then
            echo "Repository name is empty after sanitization" >&2
            exit 1
          fi
          source_ref="$GITHUB_REF_NAME"
          publish_env='${{ inputs.environment }}'
          if [[ -z "$publish_env" ]]; then
            publish_env='${{ github.event.inputs.environment }}'
          fi
          if [[ -z "$publish_env" ]]; then
            publish_env='dev'
          fi
          case "$publish_env" in
            dev|stage|prod)
              ;;
            *)
              echo "Invalid or empty environment input. Expected one of: dev, stage, prod" >&2
              exit 1
              ;;
          esac
          echo "REPO_NAME=$safe_repo_name" >> "$GITHUB_ENV"
          echo "SOURCE_REF_NAME=$source_ref" >> "$GITHUB_ENV"
          echo "PUBLISH_ENV=$publish_env" >> "$GITHUB_ENV"
      - name: Install CUE
        shell: bash
        run: |
          set -euo pipefail
          curl -sSLo cue.tar.gz https://github.com/cue-lang/cue/releases/download/v0.9.2/cue_v0.9.2_linux_amd64.tar.gz
          tar -xzf cue.tar.gz
          mkdir -p "$HOME/bin"
          mv cue "$HOME/bin/"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/cue" version
      - name: Generate manifests for selected environment
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "cac/generated/${PUBLISH_ENV}"
          (
            cd cac
            cue cmd -t deployment="${PUBLISH_ENV}" -t env="${PUBLISH_ENV}" -t tag="${SOURCE_REF_NAME}" gen .
          )
          shopt -s nullglob
          generated_configmaps=("$GITHUB_WORKSPACE/app/cac/generated/${PUBLISH_ENV}"/configmap-*.yaml)
          shopt -u nullglob
          if [[ ${#generated_configmaps[@]} -eq 0 ]]; then
            echo "Expected generated ConfigMaps not found in: $GITHUB_WORKSPACE/app/cac/generated/${PUBLISH_ENV}" >&2
            exit 1
          fi
          printf '%s\n' "${generated_configmaps[@]}" > "$GITHUB_WORKSPACE/generated-configmaps.txt"
      - name: Checkout manifests repository
        uses: actions/checkout@v4
        with:
          repository: optum-financial/vpay-actions-common-workflow
          ref: k8s-cue-manifests
          token: ${{ secrets.AVPAY_DEVOPS }}
          path: manifests
          fetch-depth: 0

      - name: Copy appsettings ConfigMaps
        shell: bash
        run: |
          set -euo pipefail
          manifest_repo_dir="$GITHUB_WORKSPACE/manifests"
          target_env_dir="$manifest_repo_dir/k8s-cue-manifests/$REPO_NAME/$PUBLISH_ENV"
          mkdir -p "$target_env_dir"
          mapfile -t generated_configmaps < "$GITHUB_WORKSPACE/generated-configmaps.txt"
          expected_files=()
          for generated_configmap in "${generated_configmaps[@]}"; do
            expected_files+=("k8s-cue-manifests/$REPO_NAME/$PUBLISH_ENV/$(basename "$generated_configmap")")
          done
          for generated_configmap in "${generated_configmaps[@]}"; do
            cp "$generated_configmap" "$target_env_dir/"
          done
          mapfile -t working_tree_files < <(
            git -C "$manifest_repo_dir" status --porcelain=v1 --untracked-files=all -- "k8s-cue-manifests/$REPO_NAME/$PUBLISH_ENV" | awk '{print $2}'
          )
          if [[ ${#working_tree_files[@]} -eq 0 ]]; then
            echo "No configmap changes to publish."
            exit 0
          fi
          for changed_file in "${working_tree_files[@]}"; do
            if [[ "$(basename "$changed_file")" != configmap-*.yaml ]]; then
              echo "Unexpected non-configmap change in target env dir: $changed_file" >&2
              printf ' - %s\n' "${working_tree_files[@]}" >&2
              exit 1
            fi
          done
          git -C "$manifest_repo_dir" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$manifest_repo_dir" config user.name "github-actions[bot]"
          git -C "$manifest_repo_dir" add -- "${expected_files[@]}"
          mapfile -t staged_files < <(git -C "$manifest_repo_dir" diff --cached --name-only)
          if [[ ${#staged_files[@]} -eq 0 ]]; then
            echo "No configmap changes staged to publish."
            exit 0
          fi
          for staged_file in "${staged_files[@]}"; do
            if [[ "$(basename "$staged_file")" != configmap-*.yaml ]]; then
              echo "Unexpected staged non-configmap file: $staged_file" >&2
              printf ' - %s\n' "${staged_files[@]}" >&2
              exit 1
            fi
          done
          if [[ ${#staged_files[@]} -gt ${#expected_files[@]} ]]; then
            echo "Unexpected staged files in manifests repo:" >&2
            printf ' - %s\n' "${staged_files[@]}" >&2
            exit 1
          fi
          for expected_file in "${expected_files[@]}"; do
            if ! printf '%s\n' "${staged_files[@]}" | grep -Fxq "$expected_file"; then
              echo "Missing expected staged file in manifests repo: $expected_file" >&2
              printf ' - %s\n' "${staged_files[@]}" >&2
              exit 1
            fi
          done
          git -C "$manifest_repo_dir" commit -m "Publish appsettings ConfigMap for $REPO_NAME $PUBLISH_ENV"
          git -C "$manifest_repo_dir" push origin "HEAD:k8s-cue-manifests"
