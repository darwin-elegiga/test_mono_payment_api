name: Publish AppSettings ConfigMap

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to publish
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod
      source_ref:
        description: Branch, tag, or SHA to publish from.
        required: false
        type: string
        default: ''
      repo_name:
        description: Optional repo-name override for the manifest folder.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  publish-appsettings-configmap:
    runs-on:
      group: vpay-runner-group
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 0

      - name: Resolve publish context
        shell: bash
        run: |
          set -euo pipefail

          repo_name_input='${{ inputs.repo_name }}'
          if [[ -n "$repo_name_input" ]]; then
            repo_name="$repo_name_input"
          else
            repo_name='${{ github.event.repository.name }}'
          fi

          safe_repo_name="$(printf '%s' "$repo_name" | tr -cd 'A-Za-z0-9._-')"
          if [[ -z "$safe_repo_name" ]]; then
            echo "Repository name is empty after sanitization" >&2
            exit 1
          fi

          source_ref_input='${{ inputs.source_ref }}'
          if [[ -n "$source_ref_input" ]]; then
            source_ref="$source_ref_input"
          else
            source_ref="$GITHUB_REF_NAME"
          fi

          echo "REPO_NAME=$safe_repo_name" >> "$GITHUB_ENV"
          echo "SOURCE_REF_NAME=$source_ref" >> "$GITHUB_ENV"
          echo "PUBLISH_ENV=${{ inputs.environment }}" >> "$GITHUB_ENV"

      - name: Install CUE
        shell: bash
        run: |
          set -euo pipefail
          curl -sSLo cue.tar.gz https://github.com/cue-lang/cue/releases/download/v0.9.2/cue_v0.9.2_linux_amd64.tar.gz
          tar -xzf cue.tar.gz
          mkdir -p "$HOME/bin"
          mv cue "$HOME/bin/"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/cue" version

      - name: Generate manifests for selected environment
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          ./cac/scripts/generate-${PUBLISH_ENV}.sh "$SOURCE_REF_NAME"

          generated_configmap="$GITHUB_WORKSPACE/app/cac/generated/${PUBLISH_ENV}/configmap.yaml"
          if [[ ! -f "$generated_configmap" ]]; then
            echo "Expected generated ConfigMap not found: $generated_configmap" >&2
            exit 1
          fi

          echo "GENERATED_CONFIGMAP=$generated_configmap" >> "$GITHUB_ENV"

      - name: Checkout manifests repository
        uses: actions/checkout@v4
        with:
          repository: optum-financial/vpay-actions-common-workflow
          ref: k8s-cue-manifests
          token: ${{ secrets.AVPAY_DEVOPS }}
          path: manifests
          fetch-depth: 0

      - name: Copy only appsettings ConfigMap
        shell: bash
        run: |
          set -euo pipefail

          manifest_repo_dir="$GITHUB_WORKSPACE/manifests"
          target_relative_path="k8s-cue-manifests/$REPO_NAME/$PUBLISH_ENV/configmap.yaml"
          target_file="$manifest_repo_dir/$target_relative_path"

          mkdir -p "$(dirname "$target_file")"
          cp "$GENERATED_CONFIGMAP" "$target_file"

          mapfile -t working_tree_files < <(
            git -C "$manifest_repo_dir" status --porcelain=v1 --untracked-files=all | awk '{print $2}'
          )

          if [[ ${#working_tree_files[@]} -eq 0 ]]; then
            echo "No configmap changes to publish."
            exit 0
          fi

          if [[ ${#working_tree_files[@]} -ne 1 || "${working_tree_files[0]}" != "$target_relative_path" ]]; then
            echo "Unexpected changed files in manifests repo:" >&2
            printf ' - %s\n' "${working_tree_files[@]}" >&2
            exit 1
          fi

          git -C "$manifest_repo_dir" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$manifest_repo_dir" config user.name "github-actions[bot]"

          git -C "$manifest_repo_dir" add -- "$target_file"

          mapfile -t staged_files < <(git -C "$manifest_repo_dir" diff --cached --name-only)
          if [[ ${#staged_files[@]} -ne 1 || "${staged_files[0]}" != "$target_relative_path" ]]; then
            echo "Unexpected staged files in manifests repo:" >&2
            printf ' - %s\n' "${staged_files[@]}" >&2
            exit 1
          fi

          git -C "$manifest_repo_dir" commit -m "Publish appsettings ConfigMap for $REPO_NAME $PUBLISH_ENV"
          git -C "$manifest_repo_dir" push origin "HEAD:k8s-cue-manifests"
