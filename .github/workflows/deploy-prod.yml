name: deploy-to-prod
permissions:
  actions: read
  security-events: write
  id-token: write
  contents: write
  pull-requests: read
  packages: write
on:
  workflow_dispatch:
    inputs:
      CHG_TICKET:
        required: false
        type: string
      WAR_ROOM:
        type: string
        default: 'false'

jobs:
  deployment-prod:
    uses: optum-financial/vpay-actions-common-workflow/.github/workflows/helm-deploy-to-prod.yml@feature-configmap
    with:
      CHARTS_PATH: charts/payment-api
      NAMESPACE: client-payments-prod
      RELEASE_NAME: payment-api
      CHG_TICKET: ${{inputs.CHG_TICKET}}
      WAR_ROOM: ${{inputs.WAR_ROOM}}
      SOURCE_CODE_PATH: ./src
      DRYRUN: true
      PROJECT: payment-api
      IMAGES: |
        [
          {"name": "payment-web-api", "path": ".github/build-args/", "dockerfile": "Dockerfile", "context": "."}      
        ]
    secrets: inherit
