name: cue-manifest-migration-dev

permissions:
  contents: write
  actions: read
  id-token: write
  pull-requests: read
  packages: read
  security-events: write

on:
  workflow_dispatch:    
  # push:
  #   branches:
  #     - cue-migration

jobs:
  compare-cue-and-helm-manifests:
    runs-on:
      group: vpay-runner-group
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Resolve repository name
        shell: bash
        run: |
          set -euo pipefail
            repo_name='${{ github.event.repository.name }}'
            safe_repo_name="$(printf '%s' "$repo_name" | tr -cd 'A-Za-z0-9._-')"
            if [[ -z "$safe_repo_name" ]]; then
               echo "Repository name is empty after sanitization" >&2
            exit 1
            fi
          
          echo "REPO_NAME=$safe_repo_name" >> "$GITHUB_ENV"
          echo "SOURCE_REF_NAME=${{ github.ref }}" >> "$GITHUB_ENV"

      - name: Install CUE
        shell: bash
        run: |
          set -euo pipefail
          curl -sSLo cue.tar.gz https://github.com/cue-lang/cue/releases/download/v0.14.2/cue_v0.14.2_linux_amd64.tar.gz
          tar -xzf cue.tar.gz
          mkdir -p "$HOME/bin"
          mv cue "$HOME/bin/"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/cue" version

      - name: Checkout manifests repository
        uses: actions/checkout@v4
        with:
          repository: optum-financial/vpay-actions-common-workflow
          ref: k8s-cue-manifests
          token: ${{ secrets.AVPAY_DEVOPS }}
          path: manifests
          fetch-depth: 0

      - name: Generate CUE manifests
        shell: bash
        env:
          IMAGE_TAG: ${{ github.ref_name }}
          ENV_NAME: dev
        run: |
          set -euo pipefail
          cd cac
          cue cmd --inject tag="$IMAGE_TAG" --inject deployment="$ENV_NAME" --inject env="$ENV_NAME" gen .
      - name: Render Helm manifests
        shell: bash
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          env_name='dev'
          env_title="$(printf '%s' "$env_name" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')"
          cat <<EOF > default-env-dc-values.yaml
          global:
            environment:
              name: ${env_title}
              ingress:
                subdomain: ${env_name}.pks.vpayusa.net
          EOF
          # Copy chart to temp directory and remove Chart.lock to avoid sync conflicts
          chart_temp_dir="$RUNNER_TEMP/payment-api-chart"
          cp -r charts/payment-api "$chart_temp_dir"
          rm -f "$chart_temp_dir/Chart.lock"
          helm dependency build "$chart_temp_dir"
          helm template payment-api "$chart_temp_dir" \
            -f default-env-dc-values.yaml \
            -f "$chart_temp_dir/values.yaml" \
            -f "$chart_temp_dir/secret-values.yaml" \
            --namespace "client-payments-${env_name}" \
            --set "chart.virtual.shared.image.tag=${IMAGE_TAG}" \
            > "/tmp/vpay-consolidated-claim-api-helm-${env_name}.yaml"

      - name: Compare CUE and Helm manifests
        shell: bash
        env:
          ENV_NAME: dev
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import os

          import yaml

          env_name = os.environ["ENV_NAME"]
          cue_dir = Path(f"cac/generated/{env_name}")
          helm_file = Path(f"/tmp/vpay-consolidated-claim-api-helm-{env_name}.yaml")

          def load_documents(directory_or_file):
            documents = []
            paths = sorted(directory_or_file.glob("*.yaml")) if directory_or_file.is_dir() else [directory_or_file]
            for path in paths:
              for document in yaml.safe_load_all(path.read_text()):
                if document is not None:
                  documents.append(document)
            return documents

          def metadata(document):
            return document.get("metadata") or {}

          def spec(document):
            return document.get("spec") or {}

          def template_spec(document):
            return (((spec(document).get("template") or {}).get("spec")) or {})

          def normalize_image(image):
            if not image:
              return image
            parts = image.split("/")
            if len(parts) < 3:
              return image
            return "/".join(parts[-2:])

          def deployment_images(document):
            if document.get("kind") != "Deployment":
              return []
            containers = template_spec(document).get("containers") or []
            normalized_images = []
            for container in containers:
              normalized_images.append(normalize_image(container.get("image")))
            return sorted(image for image in normalized_images if image is not None)

          def compare_kind(document):
            kind = document.get("kind")
            if kind == "ExternalSecret":
              return "Secret"
            if kind == "HTTPRoute":
              return "Ingress"
            if kind == "ConfigMap":
              return None
            return kind

          def compare_key(document):
            kind = compare_kind(document)
            if kind is None:
              return None
            return (kind, metadata(document).get("name") or "")

          cue_docs = load_documents(cue_dir)
          helm_docs = load_documents(helm_file)

          cue_keys = sorted(key for doc in cue_docs if (key := compare_key(doc)) is not None)
          helm_keys = sorted(key for doc in helm_docs if (key := compare_key(doc)) is not None)

          if cue_keys != helm_keys:
            raise SystemExit(f"CUE and Helm manifest keys differ for {env_name}: {cue_keys} != {helm_keys}")

          cue_images = sorted(
            (compare_key(doc), deployment_images(doc))
            for doc in cue_docs
            if compare_key(doc) is not None and deployment_images(doc)
          )
          helm_images = sorted(
            (compare_key(doc), deployment_images(doc))
            for doc in helm_docs
            if compare_key(doc) is not None and deployment_images(doc)
          )

          if cue_images != helm_images:
            raise SystemExit(f"CUE and Helm deployment images differ for {env_name}: {cue_images} != {helm_images}")

          print(f"CUE and Helm manifests match for {env_name}")
          PY

  build-and-publish:
    needs: compare-cue-and-helm-manifests
    uses: optum-financial/vpay-actions-common-workflow/.github/workflows/docker-build-and-publish-saas.yml@main
    with: 
      PROJECT: payment-api
      IMAGE_NAME: payment-web-api
      DOCKERFILE: Dockerfile
      DOCKER_CONTEXT_DIR: ""
      DOCKER_URL: "centraluhg.jfrog.io"
      BUILD_ARGS_ENV_FILE_PATH: .github/build-args/
    secrets: inherit
  
  publish-cue-manifests:
    uses: optum-financial/vpay-actions-common-workflow/.github/workflows/publish-cue-manifests.yaml@feature/docker-tags-output
    needs: [compare-cue-and-helm-manifests,build-and-publish]
    with:
     ENV_NAME: dev
    secrets: inherit 
