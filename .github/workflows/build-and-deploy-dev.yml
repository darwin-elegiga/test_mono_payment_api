name: build-and-deploy-to-dev
on:
  workflow_dispatch:
    inputs:
      PRE:
        required: true
        type: boolean
        default: true
  release:
    types: [published]
  push:
    tags:
      - "*"

jobs:
  sonar:
    uses: optum-financial/vpay-actions-common-workflow/.github/workflows/sonar-analysis.yml@test/sonar-token
    secrets:
      SONAR_TOKEN: ${{ secrets.DEVVAULT_TOKEN }}
      
