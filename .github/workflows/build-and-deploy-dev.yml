name: build-and-deploy-to-dev
permissions:
  contents: write
  actions: read
  id-token: write
  pull-requests: read 
  packages: read 
  security-events: write
on: 
  workflow_dispatch:
   inputs:
      PRE:
        required: true
        type: boolean
        default: true
  release:
    types: [published]
  push:
    tags:
      - '*'

jobs:
  sonar:
    uses: optum-financial/vpay-actions-common-workflow/.github/workflows/sonar-analysis-dotnet.yml@main
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
    
  build-and-publish:
    needs: sonar
    if: always()
    uses: optum-financial/vpay-actions-common-workflow/.github/workflows/docker-build-and-publish-saas.yml@main
    with: 
      PROJECT: payment-api
      IMAGE_NAME: payment-web-api
      DOCKERFILE: Dockerfile
      DOCKER_CONTEXT_DIR: ""
      DOCKER_URL: "centraluhg.jfrog.io"
      BUILD_ARGS_ENV_FILE_PATH: .github/build-args/
    secrets: inherit

  deployment-plano-dev:
    if: always()
    uses: optum-financial/vpay-actions-common-workflow/.github/workflows/helm-deploy-plano-dev.yml@main
    needs: [build-and-publish]
    with: 
      CHARTS_PATH: charts/payment-api
      NAMESPACE: client-payments-dev
      RELEASE_NAME: payment-api
      DRYRUN: false
    secrets: inherit
  deployment-stl-dev:
    if: always()
    uses: optum-financial/vpay-actions-common-workflow/.github/workflows/helm-deploy-stl-dev.yml@main
    needs: [build-and-publish]
    with: 
      CHARTS_PATH: charts/payment-api
      NAMESPACE: client-payments-dev
      RELEASE_NAME: payment-api
      DRYRUN: false
    secrets: inherit    
