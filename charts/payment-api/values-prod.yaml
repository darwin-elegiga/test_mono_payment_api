api:
  replicas: 3
  environment:
    ingress:
      domains:
        - payapi.vpayusa.net
  enabled: true
  generate:
    custom_configmap: true
  configMaps:
    appsettings.json:
      mount: true
      type: json
      mountPath: /app/appsettings.json
      subPath: appsettings.json
      sourceFile: ./VPay.Payment.Api/appsettings.json
      data: {}
    appsettings.production.json:
      mount: true
      type: json
      mountPath: /app/appsettings.Production.json
      subPath: appsettings.production.json
      sourceFile: ./VPay.Payment.Api/appsettings.Production.json
      data: {}
