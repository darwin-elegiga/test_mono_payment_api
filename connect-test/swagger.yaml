securityDefinitions:
  VPay:
    type: basic
    description: Basic HTTP Auth
x-ibm-configuration:
  assembly:
    execute:
      - gatewayscript:
          title: gatewayscript
          version: 1.0.0
          source: >-
            apim.setvariable('message.headers.accept', 'application/json');

            apim.setvariable('message.headers.content-type',
            'application/json');
      - invoke:
          title: invoke
          timeout: 60
          verb: keep
          cache-response: protocol
          cache-ttl: 900
          stop-on-error:
            - null
          version: 1.0.0
          target-url: 'http://10.120.202.99:32774/api/Main/echo'
    catch: []
  gateway: datapower-gateway
host: $(catalog.host)
