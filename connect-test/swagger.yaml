          in: body
          required: false
          schema:
            $ref: '#/definitions/AuthenticationParam'
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/UserSessionInfo'
  /api/Health:
    get:
      tags:
        - Health
      summary: >-
        Checks to see if the application can connect to all the required
        services
      operationId: ApiHealthGet
      consumes: []
      produces:
        - application/json
      parameters: []
      responses:
        '200':
          description: Returns if every service passes it's health check
          schema:
            uniqueItems: false
            type: array
            items:
              $ref: '#/definitions/ServiceComponentStatus'
        '500':
          description: Returns if at least one service fails it's health check
          schema:
            uniqueItems: false
            type: array
            items:
              $ref: '#/definitions/ServiceComponentStatus'
  /api/Main/version:
    get:
