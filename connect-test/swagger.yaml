swagger: '2.0'
info:
  version: v1.0.0
  title: Payment API
  x-ibm-name: Payment-API
paths:
  /api/About:
    get:
      tags:
        - About
      summary: About the build that created the service
      operationId: ApiAboutGet
      consumes: []
      produces:
        - application/json
      parameters: []
      responses:
        '200':
          description: Information about the build that created the service
          schema:
            $ref: '#/definitions/AboutInfo'
  /api/Auth/echo:
    get:
      tags:
        - Auth
      operationId: ApiAuthEchoGet
      consumes: []
      produces:
        - text/plain
        - application/json
        - text/json
      parameters: []
      responses:
        '200':
          description: Success
          schema:
            type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
        - VPay: []
  /api/Auth/test-auth:
    post:
      tags:
        - Auth
      operationId: ApiAuthTest-authPost
      consumes:
        - application/json-patch+json
        - application/json
        - text/json
        - application/*+json
      produces:
        - text/plain
        - application/json
        - text/json
      parameters:
        - name: entity
          in: body
          required: false
          schema:
            $ref: '#/definitions/AuthenticationParam'
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/AuthenticationResult'
  /api/Auth/test-login:
